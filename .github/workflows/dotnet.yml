name: Part 3 CI

# Builds the API and the MVC project, runs the tests, and checks that the MVC Docker image builds.
# GitHub only reads workflows from the .github folder at the ROOT of the repository.
# If your Part 3 folder is not called "Part3", change PROJECT_DIR below.

on:
  push:
  pull_request:

env:
  PROJECT_DIR: Part3
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore (API, MVC and tests)
        run: dotnet restore ${{ env.PROJECT_DIR }}/RaceDay.sln

      - name: Build API
        run: dotnet build ${{ env.PROJECT_DIR }}/RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore

      - name: Build MVC project
        run: dotnet build ${{ env.PROJECT_DIR }}/RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.PROJECT_DIR }}/RaceDay.sln --configuration Release --no-restore --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the MVC Docker image
        run: docker build -t raceday-web ${{ env.PROJECT_DIR }}/RaceDay.Web

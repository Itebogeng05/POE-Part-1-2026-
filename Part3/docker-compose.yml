# Optional: runs the WHOLE system (MVC app + API + SQL Server + local Azure Blob emulator) with one command:
#     docker compose up --build
# Then open http://localhost:8080
#
# The Azurite account key below is the public, well-known development key. It is not a real secret.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RaceDay_Dev#2026"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0

  api:
    build: ./RaceDay.Api
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      ConnectionStrings__RaceDayDb: "Server=sqlserver;Database=RaceDayDB;User Id=sa;Password=RaceDay_Dev#2026;TrustServerCertificate=True"
      AzureStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AzureStorage__ContainerName: "event-banners"
      Jwt__Key: "RaceDay-Compose-Signing-Key-Change-Me-2026!"
    ports:
      - "5100:8080"

  web:
    build: ./RaceDay.Web
    depends_on:
      - api
    environment:
      ApiSettings__BaseUrl: "http://api:8080/"
    ports:
      - "8080:8080"
